<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farmer Portal Login - Kisan Mitra AI</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%200%20100%20100%22><text y=%22.9em%22 font-size=%2290%22>🌾</text></svg>">
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-brand">
      <div style="font-size: 42px;">🌾</div>
      <h1>Kisan Mitra AI</h1>
      <p>AI-Powered Farmer Query Support & Advisory System</p>
    </div>

    <!-- Alert Box for Error or Success Feedback -->
    <div class="alert-message alert-error" id="auth-error"></div>
    <div class="alert-message alert-success" id="auth-success"></div>

    <!-- Tab Switcher -->
    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Sign In</button>
      <button class="auth-tab" id="tab-register" onclick="switchTab('register')">Register New Farmer</button>
    </div>

    <!-- 1. Login Form -->
    <form id="form-login">
      <div class="form-group">
        <label for="login-username">Username</label>
        <input type="text" id="login-username" class="form-input" placeholder="e.g. ramesh_singh" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" class="form-input" placeholder="Enter your password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-primary-auth" id="btn-login-submit">Sign In to Dashboard</button>
    </form>

    <!-- 2. Registration Form -->
    <form id="form-register" style="display: none;">
      <div class="form-group">
        <label for="reg-fullname">Full Name</label>
        <input type="text" id="reg-fullname" class="form-input" placeholder="e.g. Ramesh Singh" required>
      </div>
      <div class="form-group">
        <label for="reg-username">Username</label>
        <input type="text" id="reg-username" class="form-input" placeholder="e.g. ramesh_singh (letters, numbers, _)" required>
      </div>
      <div class="form-group">
        <label for="reg-location">Farming Location / District</label>
        <input type="text" id="reg-location" class="form-input" placeholder="e.g. Karnal, Haryana or Delhi,IN" value="Delhi,IN">
      </div>
      <div class="form-group">
        <label for="reg-password">Create Password (min 6 characters)</label>
        <input type="password" id="reg-password" class="form-input" placeholder="Choose a secure password" minlength="6" required>
      </div>
      <button type="submit" class="btn-primary-auth" id="btn-reg-submit">Create Farmer Account</button>
    </form>

    <div class="divider">or</div>

    <!-- Instant 1-Click Guest Access for College Evaluation / Viva -->
    <button type="button" class="btn-demo-guest" id="btn-guest-login">
      ⚡ Quick Access: Continue as Demo Farmer
    </button>
  </div>

  <script src="/js/auth.js"></script>
  <script>
    function switchTab(mode) {
      const tabLogin = document.getElementById('tab-login');
      const tabReg = document.getElementById('tab-register');
      const formLogin = document.getElementById('form-login');
      const formReg = document.getElementById('form-register');
      hideAlerts();

      if (mode === 'login') {
        tabLogin.classList.add('active');
        tabReg.classList.remove('active');
        formLogin.style.display = 'block';
        formReg.style.display = 'none';
      } else {
        tabReg.classList.add('active');
        tabLogin.classList.remove('active');
        formLogin.style.display = 'none';
        formReg.style.display = 'block';
      }
    }

    function showError(msg) {
      const errBox = document.getElementById('auth-error');
      const successBox = document.getElementById('auth-success');
      successBox.style.display = 'none';
      errBox.textContent = msg;
      errBox.style.display = 'block';
    }

    function showSuccess(msg) {
      const errBox = document.getElementById('auth-error');
      const successBox = document.getElementById('auth-success');
      errBox.style.display = 'none';
      successBox.textContent = msg;
      successBox.style.display = 'block';
    }

    function hideAlerts() {
      document.getElementById('auth-error').style.display = 'none';
      document.getElementById('auth-success').style.display = 'none';
    }

    // Login Form Submit
    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlerts();
      const u = document.getElementById('login-username').value.trim();
      const p = document.getElementById('login-password').value;
      const btn = document.getElementById('btn-login-submit');

      btn.disabled = true;
      btn.textContent = 'Signing in...';

      try {
        const result = await loginUser(u, p);
        if (result.success) {
          showSuccess(result.message || 'Login successful!');
          setTimeout(() => { window.location.href = '/'; }, 500);
        } else {
          showError(result.error || 'Login failed. Please check your credentials.');
        }
      } catch (err) {
        showError('Network error connecting to authentication server.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign In to Dashboard';
      }
    });

    // Register Form Submit
    document.getElementById('form-register').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlerts();
      const name = document.getElementById('reg-fullname').value.trim();
      const u = document.getElementById('reg-username').value.trim();
      const loc = document.getElementById('reg-location').value.trim();
      const p = document.getElementById('reg-password').value;
      const btn = document.getElementById('btn-reg-submit');

      btn.disabled = true;
      btn.textContent = 'Creating account...';

      try {
        const result = await registerUser(u, p, name, loc);
        if (result.success) {
          showSuccess(result.message || 'Registration successful! Redirecting...');
          setTimeout(() => { window.location.href = '/'; }, 600);
        } else {
          showError(result.error || 'Registration failed.');
        }
      } catch (err) {
        showError('Network error connecting to registration server.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Create Farmer Account';
      }
    });

    // Quick Demo Guest Access
    document.getElementById('btn-guest-login').addEventListener('click', async () => {
      hideAlerts();
      const btn = document.getElementById('btn-guest-login');
      btn.disabled = true;
      btn.textContent = 'Launching Demo Farmer Session...';

      try {
        const result = await loginAsGuest();
        if (result.success) {
          window.location.href = '/';
        } else {
          showError(result.error || 'Could not start demo session.');
        }
      } catch (err) {
        showError('Network error connecting to server.');
      } finally {
        btn.disabled = false;
        btn.textContent = '⚡ Quick Access: Continue as Demo Farmer';
      }
    });

    // Check if already logged in on page load
    getCurrentUser().then(user => {
      if (user) {
        window.location.href = '/';
      }
    });
  </script>
</body>
</html>
